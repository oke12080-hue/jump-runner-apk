
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jump 
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080f1e;
  color: #f8fafc;
  font-family: Arial, sans-serif;
}

button {
  border: 1px solid #3b82f6;
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: bold;
  background: linear-gradient(145deg, #2563eb, #1d4ed8);
  color: white;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 4px 0 #172554;
  transition: transform .12s, filter .12s;
}

button:active {
  transform: scale(.96);
  filter: brightness(1.15);
}

.app-shell {
  width: 100%;
  max-width: 1100px;
  min-height: 100vh;
  margin: auto;
  padding: 12px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 14px;
  background: #111e34;
  border: 1px solid #263b5b;
  border-radius: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  white-space: nowrap;
}

.brand-icon {
  font-size: 27px;
}

h1 
  color: #4ade80;
  font-size: 22px;
  margin: 0;
  letter-spacing: 1px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  flex: 1;
}

.stats div {
  background: #1c2d48;
  border: 1px solid #304563;
  border-radius: 10px;
  padding: 9px 5px;
  text-align: center;
  font-size: 14px;
  white-space: nowrap;
}

.stats span {
  color: #facc15;
  font-weight: bold;
}

.health-panel {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  padding: 5px 12px;
  font-size: 16px;
  font-weight: bold;
}

#lives {
  color: #fb7185;
}

#healthTrack {
  width: min(45vw, 280px);
  height: 14px;
  background: #334155;
  border: 1px solid #475569;
  border-radius: 20px;
  overflow: hidden;
}

#healthFill {
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, #ef4444, #fb7185);
  transition: width .2s;
}

.game-stage {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: 8px;
  background: linear-gradient(145deg, #142541, #0d172b);
  border: 2px solid #334b70;
  border-radius: 20px;
  box-shadow: 0 10px 28px #0006;
}

canvas {
  display: block;
  width: auto;
  height: min(46vh, 320px);
  max-width: 100%;
  margin: 0 auto;
  border: 3px solid #64748b;
  border-radius: 12px;
  background: #9cddff;
  touch-action: none;
}

.controls {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 20px minmax(0, .7fr);
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
}

.move-controls {
  grid-column: 1;
  display: flex;
  gap: 8px;
}

.control-space {
  grid-column: 2;
}

.jump-control {
  grid-column: 3;
  display: flex;
}

.move-controls button,
.jump-control button {
  flex: 1;
  min-width: 0;
  min-height: 54px;
  padding: 10px 5px;
  font-size: 15px;
}

.jump-control button {
  background: linear-gradient(145deg, #16a34a, #15803d);
  border-color: #4ade80;
  box-shadow: 0 4px 0 #14532d;
}

.game-actions {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

#message {
  margin: 0;
  min-height: 20px;
  color: #cbd5e1;
  font-size: 14px;
  text-align: center;
}

.action-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  width: 100%;
}

#start {
  background: linear-gradient(145deg, #22c55e, #15803d);
  border-color: #4ade80;
  box-shadow: 0 4px 0 #14532d;
}

#homeBtn {
  background: #334155;
  border-color: #64748b;
  box-shadow: 0 4px 0 #1e293b;
}

#shopBtn {
  background: linear-gradient(145deg, #9333ea, #6b21a8);
  border-color: #c084fc;
  box-shadow: 0 4px 0 #581c87;
}

#pauseBtn {
  background: #475569;
  border-color: #94a3b8;
  box-shadow: 0 4px 0 #1e293b;
}

/* Home screen */
#homeMenu {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 20px;
  background:
    radial-gradient(circle at top, #244b78, transparent 55%),
    linear-gradient(145deg, #0f172a, #142d4b 60%, #14532d);
  color: white;
  text-align: center;
}

#homeMenu h2 {
  font-size: clamp(34px, 7vw, 58px);
  color: #4ade80;
  margin: 0;
  letter-spacing: 2px;
  text-shadow: 0 4px 15px #0008;
}

#homeMenu p {
  color: #dbeafe;
  font-size: 16px;
  margin: 4px;
}

#homeMenu .hero {
  font-size: clamp(50px, 12vw, 90px);
}

#playNow {
  background: linear-gradient(145deg, #22c55e, #15803d);
  color: white;
  font-size: 22px;
  padding: 15px 55px;
  border: 2px solid #bbf7d0;
  box-shadow: 0 5px 0 #14532d;
}

/* Shop */
#shopModal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #020617dd;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

.shop-card {
  background: #111e34;
  color: white;
  width: 100%;
  max-width: 420px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 18px;
  border: 1px solid #3b5276;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 40px #0008;
}

.shop-card h2 {
  color: #c4b5fd;
  margin-top: 0;
}

.shop-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: #1c2d48;
  border: 1px solid #344b6b;
  border-radius: 12px;
  padding: 10px;
  margin: 10px 0;
}

.skin-preview {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  flex-shrink: 0;
}

.skin-buy {
  padding: 9px;
  border-radius: 8px;
  font-size: 12px;
}

/* Portrait phones */
@media (orientation: portrait) {
  .app-shell {
    min-height: 100vh;
    padding: 10px;
    gap: 10px;
  }

  .topbar {
    flex-direction: column;
    gap: 10px;
    padding: 12px 8px;
  }

  .stats {
    width: 100%;
    gap: 5px;
  }

  .stats div {
    font-size: 12px;
    padding: 9px 2px;
  }

  .game-stage {
    padding: 5px;
  }

  canvas {
    width: 100%;
    height: auto;
  }

  .controls {
    grid-template-columns: minmax(0, 1fr) 8px minmax(0, .7fr);
    gap: 5px;
  }

  .move-controls {
    gap: 5px;
  }

  .move-controls button,
  .jump-control button {
    min-height: 52px;
    font-size: 13px;
  }

  .action-buttons {
    gap: 8px;
  }

  .action-buttons button {
    flex: 1 1 40%;
    padding: 12px 5px;
    font-size: 13px;
  }
}

/* Compact landscape screens */
@media (orientation: landscape) and (max-height: 500px) {
  .app-shell {
    min-height: 100vh;
    padding: 6px 12px;
    gap: 6px;
  }

  .topbar {
    padding: 6px 10px;
    border-radius: 12px;
  }

  h1 {
    font-size: 18px;
  }

  .brand-icon {
    font-size: 21px;
  }

  .stats {
    gap: 5px;
  }

  .stats div {
    padding: 6px 3px;
    font-size: 12px;
  }

  .health-panel {
    padding: 0;
    font-size: 13px;
  }

  #healthTrack {
    height: 11px;
  }

  .game-stage {
    padding: 4px;
    border-radius: 13px;
  }

  canvas {
    height: 42vh;
  }

  .controls {
    gap: 6px;
  }

  .move-controls button,
  .jump-control button {
    min-height: 42px;
    padding: 6px;
    font-size: 12px;
  }

  .game-actions {
    gap: 4px;
  }

  #message {
    min-height: 15px;
    font-size: 12px;
  }

  .action-buttons {
    gap: 6px;
  }

  .action-buttons button {
    padding: 7px 12px;
    font-size: 12px;
  }
}
</style>

</head>
<body>

<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🏃‍♂️</span>
      <h1>JUMP RUNNER</h1>
    </div>

    <div class="stats">
      <div>🏆 Score<br><span id="score">0</span></div>
      <div>🪙 Coins<br><span id="coinCount">0</span></div>
      <div>🥇 Best<br><span id="highScore">0</span></div>
      <div>⚡ Speed<br><span id="speed">1</span></div>
    </div>
  </header>

  <div class="health-panel">
    <span>❤️ Lives: <span id="lives">3</span></span>
    <div id="healthTrack">
      <div id="healthFill"></div>
    </div>
  </div>

  <div class="game-stage">
    <canvas id="game" width="800" height="320"></canvas>
  </div>

  <div class="controls">
    <div class="move-controls">
      <button id="left">◀ LEFT</button>
      <button id="right">RIGHT ▶</button>
    </div>

    <div class="control-space"></div>

    <div class="jump-control">
      <button id="jump">⬆ JUMP</button>
    </div>
  </div>

  <div class="game-actions">
    <p id="message">Press START GAME to play!</p>

    <div class="action-buttons">
      <button id="pauseBtn">⏸️ PAUSE</button>
      <button id="start">START GAME</button>
      <button id="homeBtn">🏠 HOME</button>
      <button id="shopBtn">🛒 SHOP</button>
    </div>
  </div>

</div>

<div id="shopModal">
  <div class="shop-card">
    <h2>🛒 Skin Shop</h2>
    <p>🪙 Coins: <span id="shopCoins">0</span></p>

    <div class="shop-item">
      <span class="skin-preview" style="background:#2563eb"></span>
      <span>💙 Blue (Free)</span>
      <button class="skin-buy" data-color="#2563eb" data-price="0">EQUIP</button>
    </div>

    <div class="shop-item">
      <span class="skin-preview" style="background:#ef4444"></span>
      <span>❤️ Fire Red</span>
      <button class="skin-buy" data-color="#ef4444" data-price="50">BUY 50</button>
    </div>

    <div class="shop-item">
      <span class="skin-preview" style="background:#22c55e"></span>
      <span>💚 Neon Green</span>
      <button class="skin-buy" data-color="#22c55e" data-price="100">BUY 100</button>
    </div>

    <div class="shop-item">
      <span class="skin-preview" style="background:#facc15"></span>
      <span>💛 Gold</span>
      <button class="skin-buy" data-color="#facc15" data-price="200">BUY 200</button>
    </div>

    <p id="shopStatus">Choose a skin!</p>
    <button id="closeShop">CLOSE ✖</button>
  </div>
</div>


<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const coinEl = document.getElementById("coinCount");
let coinBalance = Number(localStorage.getItem("jumpRunnerCoins") || 0);
coinEl.textContent = coinBalance;
const highScoreEl = document.getElementById("highScore");
let highScore = Number(localStorage.getItem("jumpRunnerHighScore") || 0);
highScoreEl.textContent = highScore;
const speedEl = document.getElementById("speed");
const livesEl = document.getElementById("lives");
const healthFill = document.getElementById("healthFill");
const message = document.getElementById("message");
const startBtn = document.getElementById("start");

const W = 800, H = 320, ground = 270;
let player, obstacles, score, speed, running, over;
let frame = 0, spawn = 0, raf;
let coins = [];
let lives = 3, invulnerable = 0;
let audioCtx = null;

function sound(freq, duration, type = "sine") {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext ||
        window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001, audioCtx.currentTime + duration
    );
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}


// Skin shop
const shopModal = document.getElementById("shopModal");
const shopCoins = document.getElementById("shopCoins");
const shopStatus = document.getElementById("shopStatus");
let currentSkin = localStorage.getItem("jumpRunnerSkin") || "#2563eb";
let ownedSkins;
try {
  ownedSkins = JSON.parse(
    localStorage.getItem("jumpRunnerSkins") || '["#2563eb"]'
  );
  if (!Array.isArray(ownedSkins)) ownedSkins = ["#2563eb"];
} catch (e) {
  ownedSkins = ["#2563eb"];
}
if (!ownedSkins.includes("#2563eb")) ownedSkins.push("#2563eb");

function refreshShop() {
  shopCoins.textContent = coinBalance;
  document.querySelectorAll(".skin-buy").forEach(btn => {
    const color = btn.dataset.color;
    const price = Number(btn.dataset.price);
    if (ownedSkins.includes(color)) {
      btn.textContent = currentSkin === color ? "EQUIPPED" : "EQUIP";
    } else {
      btn.textContent = "BUY " + price;
    }
  });
}

document.getElementById("shopBtn").addEventListener("click", () => {
  refreshShop();
  shopStatus.textContent = "Choose a skin!";
  shopModal.style.display = "flex";
});

document.getElementById("closeShop").addEventListener("click", () => {
  shopModal.style.display = "none";
});

document.querySelectorAll(".skin-buy").forEach(btn => {
  btn.addEventListener("click", () => {
    const color = btn.dataset.color;
    const price = Number(btn.dataset.price);

    if (!ownedSkins.includes(color)) {
      if (coinBalance < price) {
        shopStatus.textContent = "Not enough coins!";
        return;
      }
      coinBalance -= price;
      coinEl.textContent = coinBalance;
      localStorage.setItem("jumpRunnerCoins", String(coinBalance));
      ownedSkins.push(color);
      localStorage.setItem("jumpRunnerSkins", JSON.stringify(ownedSkins));
      shopStatus.textContent = "Skin purchased!";
    } else {
      shopStatus.textContent = "Skin equipped!";
    }

    currentSkin = color;
    localStorage.setItem("jumpRunnerSkin", currentSkin);
    refreshShop();
    draw();
  });
});

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background themes
  const stageScore = Math.floor(score / 5);
  let skyColor = "#9cdfff";
  let cloudColor = "#ffffff";
  let groundColor = "#22a447";
  let groundEdge = "#166534";

  if (stageScore >= 200) {
    skyColor = "#101a3a";
    cloudColor = "#cbd5e1";
    groundColor = "#27334f";
    groundEdge = "#45516b";
  } else if (stageScore >= 100) {
    skyColor = "#f6c27a";
    cloudColor = "#fff0ce";
    groundColor = "#c58b43";
    groundEdge = "#8a5727";
  }


  // Sky
  ctx.fillStyle = "#9cddff";
  ctx.fillRect(0, 0, W, H);

  // Clouds
  ctx.fillStyle = cloudColor;
  for (let i = 0; i < 4; i++) {
    let x = (i * 240 - frame * 0.5 % 950 + 950) % 850;
    ctx.beginPath();
    ctx.arc(x, 55, 20, 0, Math.PI * 2);
    ctx.arc(x + 22, 48, 25, 0, Math.PI * 2);
    ctx.arc(x + 47, 56, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ground
  ctx.fillStyle = groundColor;
  ctx.fillRect(0, ground, W, H - ground);
  ctx.fillStyle = groundEdge;
  ctx.fillRect(0, ground, W, 6);

  // Ground markings
  ctx.fillStyle = "#bbf7d0";
  for (let i = 0; i < 20; i++) {
    let x = (i * 60 - frame * speed % 60 + 800) % 800;
    ctx.fillRect(x, ground + 20, 25, 4);
  }

  // Obstacles
  for (const o of obstacles) {
    ctx.fillStyle = "#a16207";
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = "#65a30d";
    ctx.fillRect(o.x - 4, o.y + 8, 8, 12);
    ctx.fillRect(o.x + o.w - 4, o.y + 18, 8, 12);
  }

  // Coins
for (const c of coins) {
  ctx.beginPath();
  ctx.fillStyle = "#facc15";
  ctx.arc(c.x, c.y, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#ca8a04";
  ctx.stroke();
  ctx.beginPath();
  ctx.fillStyle = "#fff3a3";
  ctx.arc(c.x - 3, c.y - 3, 3, 0, Math.PI * 2);
  ctx.fill();
}

// Player
  ctx.fillStyle = currentSkin;
  ctx.fillRect(player.x, player.y + 12, player.w, player.h - 12);
  ctx.fillStyle = "#f5b987";
  ctx.fillRect(player.x + 5, player.y, 30, 26);
  ctx.fillStyle = "#111827";
  ctx.fillRect(player.x + 25, player.y + 8, 5, 5);

  ctx.fillStyle = "#1e40af";
  if (player.jumping) {
    ctx.fillRect(player.x + 5, player.y + 40, 12, 10);
    ctx.fillRect(player.x + 22, player.y + 40, 12, 10);
  } else {
    let step = Math.floor(frame / 5) % 2;
    ctx.fillRect(player.x + 4, ground - 12, 12, 12);
    ctx.fillRect(player.x + (step ? 22 : 18), ground - 12, 12, 12);
  }

  if (!running && !over) {
    ctx.fillStyle = "#10233c";
    ctx.font = "bold 36px Arial";
    ctx.textAlign = "center";
    ctx.fillText("READY TO RUN?", W / 2, 150);
  }

  if (over) {
    ctx.fillStyle = "rgba(15,23,42,0.65)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 42px Arial";
    ctx.fillText("GAME OVER!", W / 2, 135);
    ctx.font = "bold 25px Arial";
    ctx.fillText("Score: " + Math.floor(score / 5), W / 2, 180);
  }
}

function jump() {
  if (!running || player.jumping) return;
  player.vy = -14;
  player.jumping = true;
  sound(520, 0.12, "square");
}

function movePlayer(amount) {
  if (!running) return;
  player.x = Math.max(0, Math.min(W - player.w,
    player.x + amount));
  draw();
}

function reset() {
  cancelAnimationFrame(raf);
  player = {
    x: 100, y: ground - 48, w: 38, h: 48,
    vy: 0, jumping: false
  };
  obstacles = [];
  coins = [];
  score = 0;
  speed = 5;
  lives = 3;
  invulnerable = 0;
  livesEl.textContent = lives;
  healthFill.style.width = "100%";
  frame = 0;
  spawn = 60;
  running = true;
  over = false;
  scoreEl.textContent = "0";
  speedEl.textContent = "1";
  message.textContent = "Avoid the obstacles!";
  startBtn.textContent = "RESTART";
  loop();
}

function endGame() {
  running = false;
  over = true;
  sound(130, 0.4, "sawtooth");
  message.textContent = "You hit an obstacle!";
  startBtn.textContent = "PLAY AGAIN";
  draw();
}

function loop() {
  if (!running) return;
  frame++;
  score++;
  speed = 5 + Math.floor(score / 500);
  scoreEl.textContent = Math.floor(score / 5);
  const shownScore = Math.floor(score / 5);
  if (shownScore > highScore) {
    highScore = shownScore;
    highScoreEl.textContent = highScore;
    localStorage.setItem("jumpRunnerHighScore", String(highScore));
  }
  speedEl.textContent = (speed / 5).toFixed(1);

  player.y += player.vy;
  player.vy += 0.65;

  if (player.y >= ground - player.h) {
    player.y = ground - player.h;
    player.vy = 0;
    player.jumping = false;
  }

  spawn--;
  if (spawn <= 0) {
    let h = 30 + Math.random() * 30;
    obstacles.push({
      x: W + 20, y: ground - h,
      w: 25 + Math.random() * 15, h: h
    });
    spawn = 65 + Math.random() * 55;
  }

  if (invulnerable > 0) invulnerable--;

  for (const o of obstacles) {
    o.x -= speed;
    if (invulnerable === 0 &&
        player.x + player.w - 5 > o.x + 4 &&
        player.x + 5 < o.x + o.w - 4 &&
        player.y + player.h - 4 > o.y + 4) {
      lives--;
      livesEl.textContent = lives;
      healthFill.style.width = (lives / 3 * 100) + "%";
      sound(180, 0.2, "sawtooth");
      invulnerable = 60;
      o.x = -100;
      if (lives <= 0) {
        endGame();
        return;
      }
    }
  }

  // Spawn and move collectible coins
if (frame % 100 === 0) {
  coins.push({
    x: W + 20,
    y: ground - (55 + Math.random() * 75)
  });
}

for (const c of coins) {
  c.x -= speed;
  if (
    player.x < c.x + 11 &&
    player.x + player.w > c.x - 11 &&
    player.y < c.y + 11 &&
    player.y + player.h > c.y - 11
  ) {
    c.collected = true;
    coinBalance++;
    coinEl.textContent = coinBalance;
    localStorage.setItem("jumpRunnerCoins", String(coinBalance));
    sound(880, 0.08, "sine");
  }
}
coins = coins.filter(c => !c.collected && c.x > -20);

obstacles = obstacles.filter(o => o.x + o.w > 0);
  draw();
  raf = requestAnimationFrame(loop);
}

document.getElementById("left").addEventListener("click",
  () => movePlayer(-35));
document.getElementById("right").addEventListener("click",
  () => movePlayer(35));
document.getElementById("jump").addEventListener("click", jump);

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  jump();
});

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
  if (e.code === "ArrowLeft") movePlayer(-35);
  if (e.code === "ArrowRight") movePlayer(35);
});


document.getElementById("playNow").addEventListener("click", () => {
  document.getElementById("homeMenu").style.display = "none";
  sound(700, 0.15);
  reset();
});

document.getElementById("homeBtn").addEventListener("click", () => {
  running = false;
  over = false;
  cancelAnimationFrame(raf);
  startBtn.textContent = "START GAME";
  message.textContent = "Press START GAME to play!";
  document.getElementById("homeMenu").style.display = "flex";
  draw();
});

const pauseBtn = document.getElementById("pauseBtn");

startBtn.addEventListener("click", () => {
  pauseBtn.textContent = "⏸ PAUSE";
});

pauseBtn.addEventListener("click", () => {
  if (pauseBtn.textContent.includes("PAUSE")) {
    if (!running) return;

    running = false;
    cancelAnimationFrame(raf);
    pauseBtn.textContent = "▶ RESUME";
    message.textContent = "Game Paused";
  } else {
    if (over) return;

    running = true;
    pauseBtn.textContent = "⏸ PAUSE";
    message.textContent = "";
    raf = requestAnimationFrame(loop);
  }
});
startBtn.addEventListener("click", () => {
  sound(700, 0.15);
  reset();
});

player = {
  x: 100, y: ground - 48, w: 38, h: 48,
  vy: 0, jumping: false
};
obstacles = [];
score = 0;
speed = 5;
running = false;
over = false;
draw();
</script>
</body>
</html>
